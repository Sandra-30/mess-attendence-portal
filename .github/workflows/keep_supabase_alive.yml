name: Keep Supabase & Backend Awake

on:
  schedule:
    # Runs every 10 minutes to keep the Render backend awake
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -sS "https://mess-backend-eto3.onrender.com" > /dev/null
        
      - name: Ping Supabase API
        run: |
          curl -sS --fail -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          "https://vawuswttpcekihwtkadg.supabase.co/rest/v1/" > /dev/null
